<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="currentColor">
  <!-- Minimalist Constructivist 21º BC Barracks / Natal 1935 Icon -->
  <rect x="15" y="45" width="90" height="60" stroke="currentColor" stroke-width="4" fill="none" />
  
  <!-- Central Pediment / Gate -->
  <polygon points="60,15 35,45 85,45" stroke="currentColor" stroke-width="4" fill="none" />
  <rect x="48" y="75" width="24" height="30" stroke="currentColor" stroke-width="4" fill="none" />
  
  <!-- Symmetrical Windows / Barracks Embrasures -->
  <rect x="25" y="55" width="14" height="18" stroke="currentColor" stroke-width="3" fill="none" />
  <rect x="81" y="55" width="14" height="18" stroke="currentColor" stroke-width="3" fill="none" />
  
  <!-- Crenellations / Parapet -->
  <line x1="15" y1="45" x2="15" y2="38" stroke="currentColor" stroke-width="4" />
  <line x1="25" y1="45" x2="25" y2="38" stroke="currentColor" stroke-width="4" />
  <line x1="95" y1="45" x2="95" y2="38" stroke="currentColor" stroke-width="4" />
  <line x1="105" y1="45" x2="105" y2="38" stroke="currentColor" stroke-width="4" />
  
  <!-- Bullet impact marks / Russian-Modernist Constructivist Stencils -->
  <circle cx="38" cy="85" r="2.5" fill="#C81E1E" stroke="none" />
  <circle cx="43" cy="92" r="1.8" fill="#C81E1E" stroke="none" />
  <circle cx="78" cy="88" r="2.2" fill="#C81E1E" stroke="none" />
  <circle cx="85" cy="80" r="1.5" fill="#C81E1E" stroke="none" />
  <circle cx="28" cy="78" r="2" fill="#C81E1E" stroke="none" />

  <!-- Red Revolutionary Star atop the pediment -->
  <polygon points="60,25 62.5,32 70,32 64,36.5 66.5,43.5 60,39 53.5,43.5 56,36.5 50,32 57.5,32" fill="#C81E1E" stroke="#C81E1E" stroke-width="1" />
  
  <!-- Foundation Line -->
  <line x1="5" y1="105" x2="115" y2="105" stroke="currentColor" stroke-width="4" />
</svg>
